# content repo: .github/workflows/notify-website.yml
name: update-website
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy website
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.WEBSITE_REPO_PAT }}" \
            https://api.github.com/repos/daytonellwanger/agent-wiki-website/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'